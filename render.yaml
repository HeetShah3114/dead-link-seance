# Render Blueprint: one free web service runs the API and serves the séance UI.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: dead-link-seance
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w @seance/shared && npm run build -w @seance/server && npm run build -w @seance/web
    startCommand: cd apps/server && node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Listen on all interfaces; Render sets PORT.
      - key: HOST
        value: 0.0.0.0
      # Behind Render's proxy: per-user limits need the real client IP.
      - key: TRUST_PROXY
        value: "1"
      # Publishing to R2 (not secret)
      - key: DEPLOY_BUCKET
        value: dead-link-seance-sites
      - key: DEPLOY_S3_ENDPOINT
        value: https://27a922a466d56d920071914092d2eb5d.r2.cloudflarestorage.com
      - key: DEPLOY_BASE_URL
        value: https://dead-link-seance-sites.whoisheet.workers.dev
      - key: CF_ACCOUNT_ID
        value: 27a922a466d56d920071914092d2eb5d
      # Secrets: paste in the Render dashboard
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CF_AI_TOKEN
        sync: false
      # Takedown token, generated by Render (long and random)
      - key: ADMIN_TOKEN
        generateValue: true
